version: "3.8"

services:
  # Core ERP Services
  api:
    build: ./apps/saas
    environment:
      - AI_VOICE_SERVICE_URL=http://voice-service:8002
      - AI_SUPPORT_SERVICE_URL=http://ai-support-service:8003
    depends_on: [voice-service, ai-support-service]

  # AI Services
  voice-service:
    build: ./packages/ai-services/voice-service
    ports: ["8002:8002"]
    environment:
      - WHISPER_MODEL=large-v3
      - CUDA_VISIBLE_DEVICES=0
      - GPU_MEMORY_FRACTION=0.6
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./ai-models:/app/models

  ai-support-service:
    build: ./packages/ai-services/ai-support-service
    ports: ["8003:8003"]
    environment:
      - MODEL_NAME=llama-2-13b-greek-business
      - CUDA_VISIBLE_DEVICES=0
      - GPU_MEMORY_FRACTION=0.4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on: [postgres, redis]

  # Database per company
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=company_manager
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  postgres_data:
