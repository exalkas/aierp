[tool.poetry]
name = "integrations-service"
version = "0.1.0"
description = "Greek ERP/CRM Integrations Service (AADE, Banking, etc.)"
authors = ["Your Name <your.email@example.com>"]
packages = [{include = "integrations_service"}]

[tool.poetry.dependencies]
python = "^3.11"

# Integrations-specific dependencies (not in root)
requests = "^2.31.0"
lxml = "^4.9.3"
xmltodict = "^0.13.0"
qrcode = {extras = ["pil"], version = "^7.4.2"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api" 