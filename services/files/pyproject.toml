[tool.poetry]
name = "files-service"
version = "0.1.0"
description = "Greek ERP/CRM File Storage Service"
authors = ["Your Name <your.email@example.com>"]
packages = [{include = "files_service"}]

[tool.poetry.dependencies]
python = "^3.11"

# Files-specific dependencies (not in root)
