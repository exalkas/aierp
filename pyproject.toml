[tool.poetry]
name = "greek-erp-monorepo"
version = "1.0.0"
description = "Greek ERP/CRM System - Polyglot Monorepo"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "^3.11"

# Core FastAPI ecosystem - shared by all services
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

# Core utilities - shared by most services
python-dotenv = "^1.0.0"
httpx = "^0.25.2"
python-dateutil = "^2.8.2"
python-multipart = "^0.0.6"

# Database - shared by API, Auth, AI Support
sqlalchemy = "^2.0.23"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.7"

# Security - shared by API, Auth, Integrations
PyJWT = "^2.8.0"
bcrypt = "^4.1.1"
cryptography = "^41.0.7"
passlib = "^1.7.4"

# Greek business support - shared by API, Integrations
phonenumbers = "^8.13.26"
pytz = "^2023.3"

# AI/ML - shared by AI services
openai = "^1.3.7"

# Service-specific dependencies - consolidated from individual services
# API Service dependencies
requests = "^2.31.0"
babel = "^2.13.1"
emails = "^0.6"
python-magic = "^0.4.27"
Pillow = "^10.1.0"
validators = "^0.22.0"
python-slugify = "^8.0.1"
structlog = "^23.2.0"

# Auth Service dependencies
aiosmtplib = "^3.0.1"
email-validator = "^2.1.0"

# Files Service dependencies
reportlab = "^4.0.7"
PyPDF2 = "^3.0.1"
boto3 = "^1.34.0"

# Integrations Service dependencies
lxml = "^4.9.3"
xmltodict = "^0.13.0"
qrcode = {extras = ["pil"], version = "^7.4.2"}

# Voice Service dependencies
speechrecognition = "^3.10.0"
pydub = "^0.25.1"
pyaudio = "^0.2.11"
transformers = "^4.36.0"
torch = "^2.2.0"

# AI Support Service dependencies
langchain = "^0.0.350"
chromadb = "^0.4.18"
nltk = "^3.8.1"
spacy = "^3.7.2"

# Common development dependencies
[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.7.1"

# Common testing dependencies
httpx = "^0.25.2"  # For test clients
factory-boy = "^3.3.0"  # For test data generation
pytest-postgresql = "^5.0.0"  # For database testing

[tool.poetry.group.database.dependencies]
alembic = "^1.13.1"
pytest-postgresql = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["services", "packages"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto" 